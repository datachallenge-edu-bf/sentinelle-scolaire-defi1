# Lancement en une commande, depuis application/ :  docker compose up --build   (puis http://localhost:3000)
services:
  sentinelle:
    build:
      context: ..
      dockerfile: application/Dockerfile
    ports:
      - "3000:7860"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
